name: Daily Market Rotation Report

on:
  schedule:
    # Post-close: ~21:00 UTC (5:00 PM ET) — fresh EOD data.
    # Off the exact hour mark to avoid GitHub Actions' busiest scheduling queue slot.
    - cron: '07 21 * * 1-5'
    # Pre-open: ~11:00 UTC (7:00 AM ET) — review yesterday's signals before open.
    # Moved earlier than the 8:30 AM ET target (and off :30) because scheduled
    # workflows can run 1-2h late during high platform load, especially at :00/:30.
    - cron: '13 11 * * 1-5'
  workflow_dispatch:            # allow manual trigger for testing

permissions:
  contents: write   # needed to commit the generated report back to the repo

jobs:
  daily-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build fat jar
        working-directory: market-rotation-tracker-kotlin
        run: gradle jar --no-daemon

      - name: Run daily batch
        working-directory: market-rotation-tracker-kotlin
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_SUMMARY: ${{ secrets.DISCORD_WEBHOOK_SUMMARY }}
        run: java -jar build/libs/market-rotation-tracker-1.0.0.jar

      - name: Commit report back to repo
        if: always()   # commit whatever was produced, even on partial failure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-rotation-tracker-kotlin/reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: daily rotation report $(date -u +'%Y-%m-%d')"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
